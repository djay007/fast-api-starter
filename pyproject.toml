[project]
name = "fastapi-enterprise"
version = "1.0.0"
description = "Enterprise FastAPI backend template"
requires-python = ">=3.11"
authors = [
{name = "Backend Team"}
]

# -------------------------

# BLACK (Code Formatter)

# -------------------------

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '.pyi?$'
exclude = '''
/(
.git
| .venv
| venv
| build
| dist
| **pycache**
)/
'''

# -------------------------

# ISORT (Import Sorting)

# -------------------------

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = ["app"]

# -------------------------

# RUFF (PEP8 + Linter)

# -------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
".git",
"**pycache**",
"venv",
".venv",
"dist",
"build"
]

[tool.ruff.lint]
select = [
"E",  # PEP8 errors
"F",  # Python errors
"W",  # warnings
"I",  # import order
"UP", # python upgrade
"B",  # bugbear
]
ignore = [
"E501"  # line length handled by black
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -------------------------

# MYPY (Type Checking)

# -------------------------

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = true
plugins = ["pydantic.mypy"]

# -------------------------

# PYTEST

# -------------------------

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
"tests"
]

# -------------------------

# COVERAGE

# -------------------------

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# -------------------------

# BANDIT (Security Scanner)

# -------------------------

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests"]
